plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            clientData()
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.named('jar') {
    archiveFileName.set("${mod_id}-neoforge-${project.version}+${minecraft_version}.jar")
    destinationDirectory.set(file("${rootProject.projectDir}/exports"))
}

tasks.named('sourcesJar') {
    archiveFileName.set("${mod_id}-neoforge-${project.version}+${minecraft_version}-sources.jar")
    destinationDirectory.set(file("${rootProject.projectDir}/exports/sources"))
}

tasks.named('javadocJar') {
    archiveFileName.set("${mod_id}-neoforge-${project.version}+${minecraft_version}-javadoc.jar")
    destinationDirectory.set(file("${rootProject.projectDir}/exports/javadoc"))
}
